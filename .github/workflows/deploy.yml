# SPDX-License-Identifier: MIT

# Builds the site from one commit on main, deploys it to GitHub Pages, then checks the live site
# against that build. Runs on every push to main. To roll back, run it by hand with an earlier
# commit on main as `ref`.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: The commit on main to deploy (a full SHA). To roll back, an earlier one.
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time. A deploy that has started always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PNPM_VERSION: 11.28.9

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the commit is on main
        id: commit
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: |
          sha="$(git rev-parse --verify "${REF}^{commit}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main. Only commits on main are deployed."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The live build.json names the deployed commit, and every file it lists has its hash.
  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/smoke.mjs "$URL" "$COMMIT"
        env:
          URL: ${{ needs.deploy.outputs.url }}
          COMMIT: ${{ needs.build.outputs.commit }}
