# SPDX-License-Identifier: MIT

# The playground's own pull request checklist items, on top of the five that pr-checks.yml
# checks. pr-checks.yml comes byte for byte from the main repository, so these live here.
#
# Like pr-checks.yml, this runs on pull_request_target and runs the script from the base
# branch. It reads the pull request only from the event payload, as data. It never checks out
# or runs code from the pull request, and it uses no secrets.

name: PR extra checks

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-extra-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check-pr-extra.mjs
